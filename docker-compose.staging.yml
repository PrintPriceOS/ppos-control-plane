# docker-compose.staging.yml
# PrintPrice OS Control Plane — Persistent Staging Topology
# Strict isolation: dedicated bridge network, persistent named volumes, file secrets, resource limits.

version: '3.8'

networks:
  ppos_staging_net:
    driver: bridge
    internal: false # Requires internal DNS resolution; external production access blocked by host firewall

volumes:
  staging_mysql_data:
    driver: local
  staging_documents_data:
    driver: local

secrets:
  staging_db_password:
    file: ./secrets/staging_db_password.txt
  staging_root_password:
    file: ./secrets/staging_root_password.txt
  staging_jwt_secret:
    file: ./secrets/staging_jwt_secret.txt

services:
  # Database Service — MySQL 8.0.46
  staging-mysql:
    image: mysql:8.0.46
    container_name: ppos-staging-mysql
    restart: unless-stopped
    command: [
      'mysqld',
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--default-authentication-plugin=mysql_native_password',
      '--innodb-buffer-pool-size=512M',
      '--sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION'
    ]
    environment:
      MYSQL_DATABASE: ppos_control_staging
      MYSQL_USER: ppos_staging_usr
      MYSQL_PASSWORD_FILE: /run/secrets/staging_db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/staging_root_password
    secrets:
      - staging_db_password
      - staging_root_password
    volumes:
      - staging_mysql_data:/var/lib/mysql
    networks:
      - ppos_staging_net
    ports:
      - "127.0.0.1:3306:3306" # Bound strictly to loopback on staging host
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # Application Service — Control Plane
  control-plane-staging:
    build:
      context: .
      dockerfile: Dockerfile
    image: ppos-control-plane:staging-c8089d6
    container_name: ppos-control-plane-staging
    restart: unless-stopped
    depends_on:
      staging-mysql:
        condition: service_healthy
    secrets:
      - staging_db_password
      - staging_jwt_secret
    volumes:
      - staging_documents_data:/opt/printprice-os/staging-storage
    environment:
      NODE_ENV: staging
      PORT: 8081
      PPOS_CONTROL_MODE: STAGING
      PPOS_LOG_LEVEL: info
      MYSQL_HOST: staging-mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ppos_control_staging
      MYSQL_USER: ppos_staging_usr
      MYSQL_PASSWORD_FILE: /run/secrets/staging_db_password
      JWT_SECRET_FILE: /run/secrets/staging_jwt_secret
      JWT_AUDIENCE: ppos:control:staging
      JWT_ISSUER: https://staging-auth.printprice.pro
      REQUIRE_JWT_ONLY: 'true'
      ENABLE_BREAK_GLASS_TOKEN: 'false'
      PPOS_UPLOADS_DIR: /opt/printprice-os/staging-storage
      CHECKLIST_ONLY_MODE: 'ACTIVE'
      MARKETPLACE_VISIBLE: 'false'
      LIVE_QUOTING_ALLOWED: 'false'
      JOB_ROUTING_ALLOWED: 'false'
      PRODUCTION_DISPATCH_ALLOWED: 'false'
    ports:
      - "127.0.0.1:8081:8081" # Bound strictly to loopback (access via SSH tunnel / reverse proxy)
    networks:
      - ppos_staging_net
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://127.0.0.1:8081/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
