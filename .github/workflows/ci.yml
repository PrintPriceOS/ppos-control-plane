name: PPOS Control Plane CI

on:
  push:
    branches: [ main, v1.9.0, release/*, phase-10-intelligence-layer, phase-39.2-tenant-management-console, feat/paper-materials-recovery-03r, feat/paper-materials-recovery-05, feat/paper-materials-recovery-08, feat/paper-materials-recovery-09, feat/paper-materials-recovery-09h ]
  pull_request:
    branches: [ main, v1.9.0, phase-10-intelligence-layer, phase-39.2-tenant-management-console, feat/paper-supplier-hub-completion, feat/budget-01-marketplace-paper-catalog, feat/budget-02c01-quote-revisions, feat/budget-02d01-e2e-remediation, feat/spine-03r-caliper-and-engine, feat/paper-materials-recovery-05, feat/paper-materials-recovery-09 ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: ppos_control_plane_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ci_test_password
      MYSQL_DATABASE: ppos_control_plane_ci
      DATABASE_URL: mysql://root:ci_test_password@127.0.0.1:3306/ppos_control_plane_ci
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Syntax Validation
      run: |
        node -c server.js
        find src/api scripts -name "*.js" -type f -print0 | xargs -0 -n1 node -c
    - name: Production Build
      run: npm run build
    - name: Bootstrap Canonical Ephemeral Database
      env:
        PPOS_MIGRATION_EXECUTION: 'true'
        PPOS_ENABLE_SCHEMA_MUTATION: 'true'
        PPOS_CI_EPHEMERAL_FIXTURES: 'true'
      run: node scripts/bootstrap_canonical_schema.js
    - name: Execute Database Migrations (Ephemeral CI)
      env:
        PPOS_MIGRATION_EXECUTION: 'true'
        PPOS_ENABLE_SCHEMA_MUTATION: 'true'
      run: node scripts/run_control_plane_migrations.js
    - name: Autonomous Industrial Schema Integrity Check (Post-Migration 161)
      run: node scripts/verify-industrial-schema.js --profile=ACTIVE_INDUSTRIAL
    - name: Apply Phase 184G Industrial Schemas
      env:
        PPOS_MIGRATION_EXECUTION: 'true'
        PPOS_ENABLE_SCHEMA_MUTATION: 'true'
        PPOS_CI_EPHEMERAL_FIXTURES: 'true'
      run: node scripts/apply_industrial_persistence_schemas.js
    - name: Schema Integrity Check
      run: node scripts/verify-industrial-schema.js --profile=ACTIVE_INDUSTRIAL
    - name: Real MySQL 8 Concurrency & Idempotency Certification (BUDGET-02B-01R)
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: ci_test_password
      run: node scripts/test_budget02b01r_real_mysql_concurrency.js
    - name: Real MySQL 8 Schema & Sealing Validation (BUDGET-02C-01R4V)
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: ci_test_password
      run: node scripts/test_budget02c01r4v_real_mysql_schema_and_sealing.js
    - name: Real MySQL 8 E2E Integration Certification (BUDGET-02D-01)
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: ci_test_password
      run: node scripts/test_budget02d01_real_mysql_e2e.js
    - name: Real MySQL 8 Accreditation Referential Integrity & Concurrency Certification (RECOVERY-09H)
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: ci_test_password
      run: node scripts/test_recovery09h_real_mysql_integration.js
    - name: Automated Tests Execution (Vitest)
      env:
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        npx vitest run tests/PricingWorkflowConservation.test.tsx tests/PrinthouseOnboardingAuditAndGovernance.test.tsx tests/backend_tenant_security.test.js tests/calibration_residuals_compatibility_regression.test.js tests/onboarding_checksum_integrity_regression.test.js tests/legacy_phase_marker_adapter.test.js tests/migration_092_reconciliation.test.js tests/migration_140_ephemeral_fixtures.test.js tests/migration_156_157_runner.test.js tests/phase184g_industrial_persistence_and_schema_integrity.test.js tests/migration_161_persistent_reconciliation.test.js tests/budget02b01_order_paper_decisions.test.js tests/budget02c01_order_quote_revisions.test.js tests/budget02c01r_security_and_bpe_adversarial.test.js tests/budget02c01r2_authority_identity_otp.test.js tests/budget02c01r3_fiscal_calendar_provenance.test.js tests/budget02c01r4_bpe_integrity_and_business_calendar.test.js tests/budget02d01_e2e_real_integration.test.js tests/spine02_03_engine_and_api.test.js tests/paper_materials_recovery_03.test.js tests/paper_materials_recovery_09.test.js tests/paper_materials_recovery_09h_mysql_integration.test.js tests/PaperSupplierAccreditationUI.test.tsx
        if [ -f tests/GuidedPrinthouseJourney.test.tsx ]; then
          echo "Running mandatory Guided Onboarding v4 journey suite..."
          npx vitest run tests/GuidedPrinthouseJourney.test.tsx
        elif [[ "$HEAD_REF" == *"onboarding"* ]] || [[ "$REF_NAME" == *"onboarding"* ]]; then
          echo "ERROR: Mandatory GuidedPrinthouseJourney.test.tsx not found on onboarding branch!"
          exit 1
        fi
