name: PPOS Control Plane CI

on:
  push:
    branches: [ main, v1.9.0, release/*, phase-10-intelligence-layer, phase-39.2-tenant-management-console ]
  pull_request:
    branches: [ main, v1.9.0, phase-10-intelligence-layer, phase-39.2-tenant-management-console ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: ppos_control_plane_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ci_test_password
      MYSQL_DATABASE: ppos_control_plane_ci
      DATABASE_URL: mysql://root:ci_test_password@127.0.0.1:3306/ppos_control_plane_ci
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Syntax Validation
      run: |
        node -c server.js
        find src/api scripts -name "*.js" -type f -print0 | xargs -0 -n1 node -c
    - name: Production Build
      run: npm run build
    - name: Execute Database Migrations (Ephemeral CI)
      env:
        PPOS_MIGRATION_EXECUTION: 'true'
        PPOS_ENABLE_SCHEMA_MUTATION: 'true'
      run: node scripts/run_control_plane_migrations.js
    - name: Schema Integrity Check
      run: node scripts/verify-industrial-schema.js
    - name: Automated Tests Execution (Vitest)
      env:
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        npx vitest run tests/PricingWorkflowConservation.test.tsx tests/PrinthouseOnboardingAuditAndGovernance.test.tsx tests/backend_tenant_security.test.js tests/calibration_residuals_compatibility_regression.test.js tests/onboarding_checksum_integrity_regression.test.js
        if [ -f tests/GuidedPrinthouseJourney.test.tsx ]; then
          echo "Running mandatory Guided Onboarding v4 journey suite..."
          npx vitest run tests/GuidedPrinthouseJourney.test.tsx
        elif [[ "$HEAD_REF" == *"onboarding"* ]] || [[ "$REF_NAME" == *"onboarding"* ]]; then
          echo "ERROR: Mandatory GuidedPrinthouseJourney.test.tsx not found on onboarding branch!"
          exit 1
        fi



