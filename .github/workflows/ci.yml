name: PPOS Control Plane CI

on:
  push:
    branches: [ main, v1.9.0, release/*, phase-10-intelligence-layer ]
  pull_request:
    branches: [ main, v1.9.0, phase-10-intelligence-layer ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Syntax Validation
      run: |
        node -c server.js
        find src/api scripts -name "*.js" -type f -print0 | xargs -0 -n1 node -c
    - name: Production Build
      run: npm run build
    - name: Schema Integrity Check
      run: node scripts/verify-industrial-schema.js
