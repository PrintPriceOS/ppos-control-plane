name: Staging Persistent Lab Certification (OP-02B.1X)

on:
  push:
    branches: [ feat/op02b1v-staging-runbook-validation ]
  pull_request:
    branches: [ phase-39.2-tenant-management-console ]

jobs:
  staging-lab-certification:
    name: MySQL 8.0 Real Staging Lab Certification
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: staging_root_secure_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pstaging_root_secure_pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: staging_root_secure_pw
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js 22 LTS
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Verify Migration Integrity & Baseline Checksums
      run: npm run migration:integrity

    - name: Compile Production Build
      run: npm run build

    - name: Execute OP-02B.1X Automated Staging Contracts Suite
      run: npx vitest run tests/op02b1v_staging_runbook_validation.test.js

    - name: 1. Create Clean Staging Database
      run: |
        mysql -h 127.0.0.1 -u root -pstaging_root_secure_pw -e "CREATE DATABASE ppos_control_staging CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

    - name: 2. Execute Governed Persistent Bootstrap (NO Ephemeral CI Fixtures)
      env:
        PPOS_STAGING_PERSISTENT_BOOTSTRAP: 'true'
        MYSQL_DATABASE: ppos_control_staging
        DATABASE_URL: mysql://root:staging_root_secure_pw@127.0.0.1:3306/ppos_control_staging
      run: |
        node scripts/bootstrap_staging_persistent_schema.js

    - name: 3. Execute Official Sequential Migration Runner (164 Migrations 001-161)
      env:
        PPOS_MIGRATION_EXECUTION: 'true'
        PPOS_ENABLE_SCHEMA_MUTATION: 'true'
        MYSQL_DATABASE: ppos_control_staging
        DATABASE_URL: mysql://root:staging_root_secure_pw@127.0.0.1:3306/ppos_control_staging
      run: |
        node scripts/run_control_plane_migrations.js

    - name: 4. Verify Active Industrial Integrity (51/51 PASS)
      env:
        MYSQL_DATABASE: ppos_control_staging
        DATABASE_URL: mysql://root:staging_root_secure_pw@127.0.0.1:3306/ppos_control_staging
      run: |
        node scripts/verify-industrial-schema.js --profile=ACTIVE_INDUSTRIAL

    - name: 5. Verify Zero Pending Migrations on Idempotent Re-Run
      env:
        MYSQL_DATABASE: ppos_control_staging
        DATABASE_URL: mysql://root:staging_root_secure_pw@127.0.0.1:3306/ppos_control_staging
      run: |
        node scripts/run_control_plane_migrations.js --dry-run

    - name: 6. Seed Synthetic Test Data & Create Encrypted Backup
      env:
        BACKUP_PASSPHRASE: "staging_authenticated_aes_encryption_key_2026!"
        MYSQL_DATABASE: ppos_control_staging
      run: |
        mkdir -p /tmp/backups
        # Insert controlled synthetic rows in tenants and printer_nodes
        mysql -h 127.0.0.1 -u root -pstaging_root_secure_pw ppos_control_staging -e "
          INSERT INTO tenants (id, name, status, plan) VALUES ('tenant-synthetic-staging-01', 'Synthetic Staging PrintWorks', 'ACTIVE', 'PRO');
          INSERT INTO printer_nodes (id, tenant_id, name, email, status) VALUES ('node-synth-01', 'tenant-synthetic-staging-01', 'Heidelberg Staging Speedmaster', 'synth@printworks.staging', 'ACTIVE');
        "
        bash scripts/staging_backup_snapshot.sh /tmp/backups
        ls -la /tmp/backups

    - name: 7. Prepare Clean Isolated Sandbox Database for Restore Drill
      run: |
        mysql -h 127.0.0.1 -u root -pstaging_root_secure_pw -e "CREATE DATABASE ppos_control_sandbox CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

    - name: 8. Execute Hardened Restore Drill into Isolated Sandbox
      env:
        BACKUP_PASSPHRASE: "staging_authenticated_aes_encryption_key_2026!"
        MYSQL_DATABASE: ppos_control_sandbox
      run: |
        BACKUP_ENC=$(ls /tmp/backups/*.sql.gz.enc | head -n 1)
        echo "Found backup archive: $BACKUP_ENC"
        bash scripts/staging_restore_drill.sh "$BACKUP_ENC" ppos_control_sandbox

    - name: 9. Post-Restore Data, Schema and Non-Mutation Verification
      run: |
        echo "Verifying sandbox restored records..."
        SANDBOX_TENANTS=$(mysql -h 127.0.0.1 -u root -pstaging_root_secure_pw ppos_control_sandbox -N -e "SELECT count(*) FROM tenants WHERE id='tenant-synthetic-staging-01';")
        SANDBOX_NODES=$(mysql -h 127.0.0.1 -u root -pstaging_root_secure_pw ppos_control_sandbox -N -e "SELECT count(*) FROM printer_nodes WHERE id='node-synth-01';")
        SANDBOX_VERSIONS=$(mysql -h 127.0.0.1 -u root -pstaging_root_secure_pw ppos_control_sandbox -N -e "SELECT count(*) FROM schema_versions;")
        
        echo "Sandbox tenants verified: $SANDBOX_TENANTS"
        echo "Sandbox nodes verified: $SANDBOX_NODES"
        echo "Sandbox schema_versions verified: $SANDBOX_VERSIONS"
        
        if [ "$SANDBOX_TENANTS" -ne 1 ] || [ "$SANDBOX_NODES" -ne 1 ] || [ "$SANDBOX_VERSIONS" -lt 161 ]; then
          echo "FATAL: Sandbox restored data verification failed!"
          exit 1
        fi
        
        echo "Confirming origin staging database was NOT altered during restore drill..."
        ORIGIN_TENANTS=$(mysql -h 127.0.0.1 -u root -pstaging_root_secure_pw ppos_control_staging -N -e "SELECT count(*) FROM tenants WHERE id='tenant-synthetic-staging-01';")
        if [ "$ORIGIN_TENANTS" -ne 1 ]; then
          echo "FATAL: Origin staging database was corrupted during restore drill!"
          exit 1
        fi
        echo "✓ All data integrity and non-mutation assertions passed."

    - name: 10. Verify Active Industrial Integrity on Restored Sandbox (51/51 PASS)
      env:
        MYSQL_DATABASE: ppos_control_sandbox
        DATABASE_URL: mysql://root:staging_root_secure_pw@127.0.0.1:3306/ppos_control_sandbox
      run: |
        node scripts/verify-industrial-schema.js --profile=ACTIVE_INDUSTRIAL

    - name: 11. Verify Docker Compose Specification & Syntactic Build
      run: |
        docker compose -f docker-compose.staging.yml config
